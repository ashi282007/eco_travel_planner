<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
<section class="section">
  <div class="container">
    <h2 class="section-title">🚦 Eco Route Finder</h2>
    <p class="section-subtitle">
      Start typing city name and select from suggestions.
    </p>

    <form class="form-grid" action="eco_route.html" method="GET">

      <!-- SOURCE CITY -->
      <div style="position:relative;">
        <input 
          type="text" 
          id="source" 
          name="source" 
          placeholder="Source City" 
          required 
          autocomplete="off"
        >
        <div class="suggestions" id="sourceSuggestions"></div>
      </div>

      <!-- DESTINATION CITY -->
      <div style="position:relative;">
        <input 
          type="text" 
          id="destination" 
          name="destination" 
          placeholder="Destination City" 
          required 
          autocomplete="off"
        >
        <div class="suggestions" id="destinationSuggestions"></div>
      </div>

      <!-- FUEL TYPE -->
      <select name="fuel_type" required>
        <option value="">Fuel Type</option>
        <option value="Petrol">Petrol</option>
        <option value="Diesel">Diesel</option>
        <option value="Electric">Electric</option>
      </select>

      <!-- SUBMIT BUTTON -->
      <button class="btn btn-primary full-btn" type="submit">
        Suggest Eco Route
      </button>

    </form>

  </div>
</section>


<!-- AUTOCOMPLETE SCRIPT -->
<script>
async function fetchSuggestions(inputId, suggestionBoxId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestionBoxId);

  input.addEventListener("input", async () => {
    const q = input.value.trim();

    if (q.length < 1) {
      box.innerHTML = "";
      box.style.display = "none";
      return;
    }

    try {
      const res = await fetch(`/search_city?q=${q}`);
      const data = await res.json();

      box.innerHTML = "";

      if (data.length === 0) {
        box.style.display = "none";
        return;
      }

      data.forEach(city => {
        const div = document.createElement("div");
        div.classList.add("suggestion-item");
        div.innerText = city;

        div.addEventListener("click", () => {
          input.value = city;
          box.innerHTML = "";
          box.style.display = "none";
        });

        box.appendChild(div);
      });

      box.style.display = "block";
    } catch (error) {
      console.log("Autocomplete error:", error);
    }
  });

  // Hide suggestions when user clicks outside
  document.addEventListener("click", function(e) {
    if (!e.target.closest(".suggestions") && e.target !== input) {
      box.style.display = "none";
    }
  });
}

// Enable suggestions for both inputs
fetchSuggestions("source", "sourceSuggestions");
fetchSuggestions("destination", "destinationSuggestions");
</script>
</body>
</html>
